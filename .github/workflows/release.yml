name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write # create the GitHub release
      id-token: write # sign build provenance attestations
      attestations: write # store the attestations

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags, for release notes

      # Version comes from the "packageManager" field in package.json.
      - name: Use pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: pnpm

      - name: Build plugin
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      # Lets users (and Obsidian's community review) verify the release
      # assets were built from this repository.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Write release notes
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          prev="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"
          range="${prev:+${prev}..}${tag}"

          {
            echo "## Changes"
            echo
            # Skip the version-bump commits created by publish.sh.
            git log --no-merges --format='- %s' "$range" \
              | grep -vE '^- Release [0-9]+\.[0-9]+\.[0-9]+$' \
              || echo "- Maintenance release."
            if [ -n "$prev" ]; then
              echo
              echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${tag}"
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          gh release create "$tag" \
            --title="$tag" \
            --notes-file release-notes.md \
            main.js manifest.json styles.css
